name: Create Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      release_title:
        description: 'Release title'
        required: false
        type: string
        default: 'Daisy-m4 Release'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      include_binaries:
        description: 'Include compiled binaries in release'
        required: false
        type: boolean
        default: true
      generate_notes:
        description: 'Auto-generate release notes'
        required: false
        type: boolean
        default: true

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release-title: ${{ steps.version.outputs.release-title }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determine version and title
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TITLE="${{ inputs.release_title }}"
            if [ -z "$TITLE" ]; then
              TITLE="Daisy-m4 $VERSION"
            fi
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            TITLE="Daisy-m4 $VERSION - Workflow Orchestration Engine"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release-title=$TITLE" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"
          echo "Release title: $TITLE"

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify code formatting
        run: dotnet format --verify-no-changes

      - name: Build solution
        run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run tests
        run: dotnet test --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal

      - name: Publish Windows Self-Contained
        if: ${{ github.event_name == 'push' || inputs.include_binaries }}
        run: |
          dotnet publish src/Daisy/Daisy.csproj \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --runtime win-x64 \
            --self-contained true \
            --output ./publish/daisy-win-x64 \
            --property:PublishSingleFile=false \
            --property:IncludeNativeLibrariesForSelfExtract=true

      - name: Publish Linux Self-Contained
        if: ${{ github.event_name == 'push' || inputs.include_binaries }}
        run: |
          dotnet publish src/Daisy/Daisy.csproj \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --runtime linux-x64 \
            --self-contained true \
            --output ./publish/daisy-linux-x64 \
            --property:PublishSingleFile=false \
            --property:IncludeNativeLibrariesForSelfExtract=true

      - name: Verify plugins for both platforms
        if: ${{ github.event_name == 'push' || inputs.include_binaries }}
        run: |
          echo "=== Windows Build Plugins ==="
          if [ -d "./publish/daisy-win-x64/plugins" ]; then
            echo "Windows plugins found:"
            find ./publish/daisy-win-x64/plugins -name "*.dll" | wc -l
            ls -la ./publish/daisy-win-x64/plugins/
          else
            echo "Warning: No Windows plugins directory found"
          fi
          
          echo "=== Linux Build Plugins ==="
          if [ -d "./publish/daisy-linux-x64/plugins" ]; then
            echo "Linux plugins found:"
            find ./publish/daisy-linux-x64/plugins -name "*.dll" | wc -l
            ls -la ./publish/daisy-linux-x64/plugins/
          else
            echo "Warning: No Linux plugins directory found"
          fi

      - name: Create release artifacts
        if: ${{ github.event_name == 'push' || inputs.include_binaries }}
        run: |
          mkdir -p release-artifacts
          
          # Create Windows release package
          cd publish/daisy-win-x64
          zip -r ../../release-artifacts/daisy-win-x64.zip . \
            -x "*.pdb" "*.xml" "ref/*" "runtimes/*/native/*"
          cd ../..
          
          # Create Linux release package  
          cd publish/daisy-linux-x64
          zip -r ../../release-artifacts/daisy-linux-x64.zip . \
            -x "*.pdb" "*.xml" "ref/*" "runtimes/*/native/*"
          cd ../..
          
          # Create source code archive
          git archive --format=zip --output=release-artifacts/source-code.zip HEAD
          
          # Create README for releases
          cat > release-artifacts/README.txt << 'EOF'
          Daisy-m4 Workflow Orchestration Engine
          ====================================
          
          This release contains self-contained builds for Windows and Linux.
          No .NET runtime installation is required.
          
          Windows (win-x64):
          - Extract daisy-win-x64.zip
          - Run: Daisy.exe
          
          Linux (linux-x64):  
          - Extract daisy-linux-x64.zip
          - Make executable: chmod +x Daisy
          - Run: ./Daisy
          
          Both versions include all plugins and dependencies.
          
          For more information, visit:
          https://github.com/ruifrvaz/Daisy-m4
          EOF
          
          # List created artifacts with sizes
          echo "=== Release Artifacts Created ==="
          ls -lh release-artifacts/

      - name: Upload artifacts
        if: ${{ github.event_name == 'push' || inputs.include_binaries }}
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/

  create-release:
    runs-on: ubuntu-latest
    needs: validate-and-build
    if: always() && needs.validate-and-build.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        if: ${{ github.event_name == 'push' || inputs.include_binaries }}
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/

      - name: Create tag for manual release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          VERSION="${{ needs.validate-and-build.outputs.version }}"
          if ! git tag | grep -q "^$VERSION$"; then
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          else
            echo "Tag $VERSION already exists"
          fi

      - name: Generate release notes
        if: ${{ github.event_name == 'push' || inputs.generate_notes }}
        id: release-notes
        run: |
          cat > release-notes.md << 'EOF'
          ## 🚀 What's New in this Release
          
          This release includes the Daisy-m4 Workflow Orchestration Engine with the following components:
          
          ### 🔧 Core Features
          - **Modular Plugin Architecture**: Dynamic loading of Receivers, Abilities, and Transmitters
          - **Workflow Orchestration**: Sequences of modules operating over central Impulse objects
          - **Multi-Core Processing**: Parallel workflow execution with inter-core communication
          - **Configuration-Driven**: Runtime behavior controlled via appconfig.json
          
          ### 📦 Available Workflows
          - **Starter Workflow**: Interactive menu and workflow discovery
          - **Weather Workflow**: Real-time weather information retrieval
          - **Flights Workflow**: Flight information queries (mock data)
          
          ### 🔌 Plugin Modules
          - **4 Ability Modules**: Weather, Flights, Terminate, OutputValidator, Operator
          - **3 Receiver Types**: Console, WeatherEvent, FlightsEvent  
          - **2 Transmitter Types**: Console output, WorkflowTrigger loopback
          - **Auto-Discovery**: Reflection-based module loading and registration
          
          ### 🛠 Technical Stack
          - **.NET 8.0**: Modern runtime with nullable reference types
          - **Dependency Injection**: Microsoft.Extensions DI container
          - **MSBuild Integration**: Automatic plugin deployment via Directory.Build.targets
          - **Comprehensive Testing**: MSTest framework with FluentAssertions
          
          ### 📋 Usage
          
          **Windows:**
          ```cmd
          # Extract daisy-win-x64.zip
          # Run the executable
          Daisy.exe
          ```
          
          **Linux:**
          ```bash
          # Extract daisy-linux-x64.zip
          # Make executable and run
          chmod +x Daisy
          ./Daisy
          ```
          
          **Available commands:**
          - Type `start` to list workflows
          - Type `Weather: [city]` for weather info
          - Type `Flights: [city]` for flight info  
          - Type `bye` to exit
          
          **No .NET Runtime Required** - Both releases are self-contained.
          
          ### 🔍 Quality Assurance
          - All code passes formatting validation (`dotnet format --verify-no-changes`)
          - Comprehensive test coverage (29+ tests across modules)
          - Follows established architectural patterns and conventions
          
          ---
          
          For detailed documentation, see the [README.md](README.md) and [project documentation](instructions/).
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate-and-build.outputs.version }}
          name: ${{ needs.validate-and-build.outputs.release-title }}
          body_path: ${{ (github.event_name == 'push' || inputs.generate_notes) && 'release-notes.md' || '' }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          draft: false
          files: |
            release-artifacts/daisy-win-x64.zip
            release-artifacts/daisy-linux-x64.zip
            release-artifacts/source-code.zip
            release-artifacts/README.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "## 🎉 Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.validate-and-build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Title:** ${{ needs.validate-and-build.outputs.release-title }}" >> $GITHUB_STEP_SUMMARY
          echo "**Prerelease:** ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts Included:" >> $GITHUB_STEP_SUMMARY
          echo "- **daisy-win-x64.zip**: Self-contained Windows executable (no .NET required)" >> $GITHUB_STEP_SUMMARY
          echo "- **daisy-linux-x64.zip**: Self-contained Linux executable (no .NET required)" >> $GITHUB_STEP_SUMMARY  
          echo "- **source-code.zip**: Complete source code archive" >> $GITHUB_STEP_SUMMARY
          echo "- **README.txt**: Installation and usage instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links:" >> $GITHUB_STEP_SUMMARY
          echo "- [View Release](https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate-and-build.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Download Assets](https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate-and-build.outputs.version }})" >> $GITHUB_STEP_SUMMARY
