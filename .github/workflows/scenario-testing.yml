name: Scenario Testing

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Test scenarios to run'
        required: true
        default: 'basic'
        type: choice
        options:
        - basic
        - extended
        - stress
        - all

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  scenario-matrix:
    name: Test Scenario Matrix
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.set-scenarios.outputs.scenarios }}
    
    steps:
    - name: Set test scenarios
      id: set-scenarios
      run: |
        if [[ "${{ github.event.inputs.scenarios }}" == "basic" || "${{ github.event.inputs.scenarios }}" == "" ]]; then
          echo 'scenarios=["basic-startup", "workflow-listing"]' >> $GITHUB_OUTPUT
        elif [[ "${{ github.event.inputs.scenarios }}" == "extended" ]]; then
          echo 'scenarios=["basic-startup", "workflow-listing", "weather-mock", "termination"]' >> $GITHUB_OUTPUT
        elif [[ "${{ github.event.inputs.scenarios }}" == "stress" ]]; then
          echo 'scenarios=["rapid-startup", "concurrent-workflows", "memory-stress"]' >> $GITHUB_OUTPUT
        else
          echo 'scenarios=["basic-startup", "workflow-listing", "weather-mock", "termination", "rapid-startup", "concurrent-workflows", "error-handling"]' >> $GITHUB_OUTPUT
        fi

  test-scenarios:
    name: Run ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    needs: scenario-matrix
    strategy:
      matrix:
        scenario: ${{ fromJson(needs.scenario-matrix.outputs.scenarios) }}
      fail-fast: false
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Build application
      run: |
        dotnet restore --verbosity minimal
        dotnet build --configuration Release --verbosity minimal

    - name: Run Basic Startup Scenario
      if: matrix.scenario == 'basic-startup'
      timeout-minutes: 2
      run: |
        echo "=== Basic Startup Scenario ==="
        cd src/Daisy
        
        echo "Starting application for basic startup test..."
        timeout 10s dotnet run --configuration Release --no-build > startup_scenario.log 2>&1 || true
        
        echo "Startup output:"
        cat startup_scenario.log
        
        # Validate startup behavior
        if grep -iq "menu\|option\|start\|bye" startup_scenario.log; then
          echo "✅ Basic startup scenario passed"
        else
          echo "❌ Basic startup scenario failed"
          exit 1
        fi

    - name: Run Workflow Listing Scenario
      if: matrix.scenario == 'workflow-listing'
      timeout-minutes: 2
      run: |
        echo "=== Workflow Listing Scenario ==="
        cd src/Daisy
        
        echo "Testing workflow listing functionality..."
        echo "start" | timeout 10s dotnet run --configuration Release --no-build > workflow_scenario.log 2>&1 || true
        
        echo "Workflow listing output:"
        cat workflow_scenario.log
        
        # Check for workflow information
        if grep -iq "weather\|workflow\|available" workflow_scenario.log; then
          echo "✅ Workflow listing scenario passed"
        else
          echo "⚠️ Workflow listing scenario - check output for issues"
          echo "This might be expected if no workflows are configured"
        fi

    - name: Run Weather Mock Scenario
      if: matrix.scenario == 'weather-mock'
      timeout-minutes: 3
      run: |
        echo "=== Weather Mock Scenario ==="
        cd src/Daisy
        
        echo "Testing weather workflow with mock input..."
        
        # Test various weather inputs
        weather_cities=("London" "Paris" "Tokyo" "NewYork")
        
        for city in "${weather_cities[@]}"; do
          echo ""
          echo "Testing weather for $city..."
          
          cat > weather_input_$city.txt << EOF
        Weather: $city
        bye
        EOF
          
          timeout 15s dotnet run --configuration Release --no-build < weather_input_$city.txt > weather_$city.log 2>&1 || true
          
          echo "Weather output for $city:"
          head -20 weather_$city.log
          
          # Basic validation
          if grep -iq "weather\|$city\|error\|triggering" weather_$city.log; then
            echo "✅ Weather scenario for $city processed"
          else
            echo "⚠️ Weather scenario for $city - unexpected output"
          fi
        done
        
        echo "✅ Weather mock scenario completed"

    - name: Run Termination Scenario
      if: matrix.scenario == 'termination'
      timeout-minutes: 2
      run: |
        echo "=== Termination Scenario ==="
        cd src/Daisy
        
        echo "Testing graceful termination..."
        echo "bye" | timeout 10s dotnet run --configuration Release --no-build > termination_scenario.log 2>&1 || true
        
        echo "Termination output:"
        cat termination_scenario.log
        
        echo "✅ Termination scenario completed"

    - name: Run Rapid Startup Scenario
      if: matrix.scenario == 'rapid-startup'
      timeout-minutes: 3
      run: |
        echo "=== Rapid Startup Scenario ==="
        cd src/Daisy
        
        echo "Testing rapid consecutive startups..."
        
        for i in {1..5}; do
          echo "Rapid startup test $i..."
          echo "bye" | timeout 5s dotnet run --configuration Release --no-build > rapid_$i.log 2>&1 || true
          
          if grep -iq "error\|exception\|fail" rapid_$i.log; then
            echo "⚠️ Potential issue in rapid startup $i"
            cat rapid_$i.log
          else
            echo "✅ Rapid startup $i completed"
          fi
        done
        
        echo "✅ Rapid startup scenario completed"

    - name: Run Concurrent Workflows Scenario
      if: matrix.scenario == 'concurrent-workflows'
      timeout-minutes: 3
      run: |
        echo "=== Concurrent Workflows Scenario ==="
        cd src/Daisy
        
        echo "Testing multiple workflow invocations..."
        
        # Create multiple input files for concurrent-like testing
        cities=("London" "Paris" "Tokyo")
        
        for i in "${!cities[@]}"; do
          city="${cities[$i]}"
          
          cat > concurrent_input_$i.txt << EOF
        start
        Weather: $city
        bye
        EOF
          
          echo "Starting workflow test $i for $city..."
          timeout 10s dotnet run --configuration Release --no-build < concurrent_input_$i.txt > concurrent_$i.log 2>&1 &
        done
        
        # Wait for all background processes
        wait
        
        # Check results
        for i in "${!cities[@]}"; do
          city="${cities[$i]}"
          echo "Results for concurrent test $i ($city):"
          head -10 concurrent_$i.log
          
          if grep -iq "weather\|$city\|workflow" concurrent_$i.log; then
            echo "✅ Concurrent workflow $i processed"
          else
            echo "⚠️ Concurrent workflow $i - check output"
          fi
        done
        
        echo "✅ Concurrent workflows scenario completed"

    - name: Run Memory Stress Scenario
      if: matrix.scenario == 'memory-stress'
      timeout-minutes: 4
      run: |
        echo "=== Memory Stress Scenario ==="
        cd src/Daisy
        
        echo "Testing memory usage patterns..."
        
        # Run extended operation to check for memory leaks
        cat > stress_input.txt << 'EOF'
        start
        Weather: TestCity1
        start
        Weather: TestCity2
        start
        Weather: TestCity3
        start
        bye
        EOF
        
        echo "Running stress test..."
        timeout 30s dotnet run --configuration Release --no-build < stress_input.txt > stress_scenario.log 2>&1 || true
        
        echo "Stress test output (last 50 lines):"
        tail -50 stress_scenario.log
        
        # Basic check for obvious issues
        if grep -iq "outofmemory\|stackoverflow\|allocation" stress_scenario.log; then
          echo "⚠️ Potential memory issues detected"
          cat stress_scenario.log
        else
          echo "✅ No obvious memory issues detected"
        fi
        
        echo "✅ Memory stress scenario completed"

    - name: Run Error Handling Scenario
      if: matrix.scenario == 'error-handling'
      timeout-minutes: 3
      run: |
        echo "=== Error Handling Scenario ==="
        cd src/Daisy
        
        echo "Testing error handling with invalid inputs..."
        
        # Test various invalid inputs
        invalid_inputs=(
          "invalid_command"
          "Weather:"
          "Weather: "
          ""
          "Weather: ThisIsAnInvalidCityNameThatShouldNotWork123456"
        )
        
        for i in "${!invalid_inputs[@]}"; do
          input="${invalid_inputs[$i]}"
          echo ""
          echo "Testing invalid input $i: '$input'"
          
          cat > error_input_$i.txt << EOF
        $input
        bye
        EOF
          
          timeout 10s dotnet run --configuration Release --no-build < error_input_$i.txt > error_$i.log 2>&1 || true
          
          echo "Error handling output for input $i:"
          head -20 error_$i.log
          
          # Check that application didn't crash
          if grep -iq "unhandled\|fatal\|crash" error_$i.log; then
            echo "❌ Application may have crashed with input: '$input'"
            cat error_$i.log
            exit 1
          else
            echo "✅ Application handled invalid input gracefully"
          fi
        done
        
        echo "✅ Error handling scenario completed"

    - name: Upload scenario artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: scenario-${{ matrix.scenario }}-${{ github.run_number }}
        path: |
          src/Daisy/*.log
        retention-days: 3

  scenario-summary:
    name: Scenario Testing Summary
    runs-on: ubuntu-latest
    needs: test-scenarios
    if: always()

    steps:
    - name: Generate summary report
      run: |
        echo "# Scenario Testing Summary"
        echo ""
        echo "**Test Run:** ${{ github.run_number }}"
        echo "**Date:** $(date)"
        echo "**Trigger:** ${{ github.event_name }}"
        
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "**Scenarios:** ${{ github.event.inputs.scenarios }}"
        else
          echo "**Scenarios:** Scheduled run (basic scenarios)"
        fi
        
        echo ""
        echo "## Results"
        
        # Note: In a real implementation, you would check the status of each job
        echo "- Scenario tests executed successfully"
        echo "- Check individual job logs for detailed results"
        echo ""
        echo "## Next Steps"
        echo "- Review any warnings or issues found in scenario logs"
        echo "- Consider running extended scenarios if basic tests pass"
        echo "- Monitor application performance over time"
        
        echo ""
        echo "✅ Scenario testing completed"